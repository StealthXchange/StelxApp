[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
test = "test"
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
ffi = true
fs_permissions = [{ access = "read", path = "./build" }, { access = "read", path = "./vectors.json" }]

[lint]
# Generated snarkjs verifier; tests use ffi and readFile on purpose.
ignore = ["contracts/TransactionVerifier.sol"]
exclude_lints = ["unsafe-cheatcode"]

[rpc_endpoints]
robinhood_testnet = "https://rpc.testnet.chain.robinhood.com"
